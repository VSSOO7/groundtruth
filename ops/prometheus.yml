# Prometheus scrape config for the groundtruth stack.
# The API exposes /metrics (prometheus_client) with per-stage latency and query
# counters; this is what backs the Grafana latency/refusal-rate dashboards.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: groundtruth-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: groundtruth

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
