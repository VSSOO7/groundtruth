name: groundtruth

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundtruth
      POSTGRES_PASSWORD: groundtruth
      POSTGRES_DB: groundtruth
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundtruth -d groundtruth"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://groundtruth:groundtruth@postgres:5432/groundtruth
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - hf_cache:/root/.cache/huggingface

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./ops/grafana:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  hf_cache:
