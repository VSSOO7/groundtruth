[project]
name = "groundtruth"
version = "0.1.0"
description = "Production RAG over SEC filings: hybrid retrieval, XGBoost learned reranker, CI-gated eval harness."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pgvector>=0.3.6,<0.4",
    "httpx>=0.27,<1.0",
    "selectolax>=0.3.21,<0.4",
    "tiktoken>=0.8,<1.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",
    "sentence-transformers>=3.2,<6.0",
    # torch arrives transitively via sentence-transformers, but is declared here
    # explicitly so the CPU-only index below can be attached to it. On Linux,
    # PyPI's default torch wheel drags in ~2.5 GB of CUDA runtime libraries that
    # this service never touches -- embedding runs on CPU. Left unpinned it
    # dominates image size and CI build time.
    "torch>=2.2",
    "anthropic>=0.39,<1.0",
    "tenacity>=9.0,<10.0",
    "structlog>=24.4,<26.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- CPU-only torch -------------------------------------------------------
# Only Linux is redirected. PyPI already serves CPU-only wheels on macOS and
# Windows, so pinning those to the pytorch index would break local dev on a Mac
# for no benefit. `explicit = true` keeps this index scoped to torch alone --
# every other dependency still resolves from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires Postgres (deselect with -m 'not integration')",
    "llm: requires ANTHROPIC_API_KEY (deselect with -m 'not llm')",
]
